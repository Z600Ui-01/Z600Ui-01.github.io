<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOUWSTORE</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="css/plugin/reset.css" />
    <link rel="stylesheet" href="css/plugin/common.css" />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" href="images/favicon.ico">

    <script src="js/plugin/jquery-1.8.1.min.js"></script>
    <script src="js/plugin/easing.js"></script>
  </head>
  <body>
    <section id="wrap">
      <div class="wrapbg"><img src="images/01_bg.png" alt=""></div>
      <div class="wrapbg2"><img src="images/04_bg.png" alt=""></div>
      <section id="section01">
        <!-- 비주얼 -->
        <div class="visual">
          <div class="bg"><img src="images/00_bg.png" alt=""></div>
          <div class="frame"><img src="images/00_frame.png" alt=""></div>
          <div class="text"><img src="images/00_text.png" alt=""></div>
          <div class="pin"><img src="images/00_pin.png" alt=""></div>
        </div>
      </section>
      <section id="section02">
        <!-- 브랜드분석 -->
        <div class="overview">
          <div class="title"><img src="images/01_title.png" alt=""></div>
          <div class="roundtext"><img src="images/01_roundtext.png" alt=""></div>
          <div class="img"><img src="images/01_img.png" alt=""></div>
        </div>
      </section>
      <section id="section03">
        <div class="research">
          <div class="title"><img src="images/02_title.png" alt=""></div>
          <div class="graph">
            <div class="graph01"><img src="images/02_graph01.png" alt=""></div>
            <div class="graph02"><img src="images/02_graph02.png" alt=""></div>
          </div>
          <!--  -->
          <div class="circle01"><img src="images/02_circle01.png" alt=""></div>
          <div class="circle02"><img src="images/02_circle02.png" alt=""></div>
          <div class="article"><img src="images/02_article.png" alt=""></div>
          <div class="company"><img src="images/02_company.png" alt=""></div>
        </div>
      </section>
      <section id="section04">
        <div class="persona">
          <div class="title"><img src="images/03_title.png" alt=""></div>
          <div class="shadow"><img src="images/03_shadow.png" alt=""></div>
          <ul class="users">
            <li class="users01"><img src="images/03_users01.png" alt=""></li>
            <li class="users02"><img src="images/03_users02.png" alt=""></li>
            <li class="users03"><img src="images/03_users03.png" alt=""></li>
            <li class="users04"><img src="images/03_users04.png" alt=""></li>
          </ul>
        </div>
      </section>
      <section id="section05">
        <div class="style">
          <div class="title"><img src="images/04_title.png" alt=""></div>
          <div class="typo"><img src="images/04_typo.png" alt=""></div>
          <div class="logo"><img src="images/04_logo.png" alt=""></div>
          <div class="green"><img src="images/04_green.png" alt=""></div>
          <div class="brown"><img src="images/04_brown.png" alt=""></div>
        </div>
      </section>
      <section id="section06">
        <div class="gridsystem">
          <div class="img"><img src="images/05_img.png" alt=""></div>
          <div class="title"><img src="images/05_title.png" alt=""></div>
          <div class="grid"><img src="images/05_grid.png" alt=""></div>
        </div>
      </section>
      <section id="section07">
        <div class="main">
          <div class="bg"><img src="images/06_bg.png" alt=""></div>
          <div class="main01"><img src="images/06_main01.png" alt=""></div>
          <div class="title"><img src="images/06_title.png" alt=""></div>
          <div class="main02"><img src="images/06_main02.png" alt=""></div>
          <div class="mobile01"><img src="images/06_mobile01.png" alt=""></div>
          <div class="main03"><img src="images/06_main03.png" alt=""></div>
          <div class="main04"><img src="images/06_main04.png" alt=""></div>
          <div class="mobile02"><img src="images/06_mobile02.png" alt=""></div>
        </div>
      </section>
      <section id="section08">
        <div class="shop">
          <div class="title"><img src="images/07_title.png" alt=""></div>
          <ul class="bgimg">
            <li class="img01"><img src="images/07_shop_img01.png" alt=""></li>
            <li class="img03"><img src="images/07_shop_img03.png" alt=""></li>
            <li class="img04"><img src="images/07_shop_img04.png" alt=""></li>
            <li class="img05"><img src="images/07_shop_img05.png" alt=""></li>
            <li class="img06"><img src="images/07_shop_img06.png" alt=""></li>
          </ul>
          <div class="shopscreen"><img src="images/07_shop.png" alt=""></div>
          <div class="frontimg img02"><img src="images/07_shop_img02.png" alt=""></div>

          <ul class="textline">
            <li class="line01"><img src="images/07_shop_line.png" alt=""></li>
            <li class="line02"><img src="images/07_shop_line.png" alt=""></li>
            <li class="line03"><img src="images/07_shop_line.png" alt=""></li>
          </ul>

          <ul class="text">
            <li class="text01"><img src="images/07_shop_text01.png" alt=""></li>
            <li class="text02"><img src="images/07_shop_text02.png" alt=""></li>
            <li class="text03"><img src="images/07_shop_text03.png" alt=""></li>
          </ul>
        </div>
        <!--  -->
        <div class="cart">
          <div class="cartimg"><img src="images/07_cart_img.png" alt=""></div>
          <div class="cart01"><img src="images/07_cart01.png" alt=""></div>
          <div class="cart02"><img src="images/07_cart02.png" alt=""></div>
        </div>
      </section>
      <section id="section09">
        <div class="about">
          <div class="full"><img src="images/07_about_full.png" alt=""></div>\

          <div class="about02"><img src="images/07_about02.png" alt=""></div>
          <div class="about01"><img src="images/07_about01.png" alt=""></div>
          <div class="aboutimg"><img src="images/07_about_img.png" alt=""></div>

          <div class="addimg"><img src="images/07_about03_addimg.png" alt=""></div>
          <div class="about03"><img src="images/07_about03.png" alt=""></div>
          <div class="addtext"><img src="images/07_about03_text.png" alt="">
          </div>
        </div>
      </section>
      <section id="section10">
        <div class="contact">
          <div class="contactbg"><img src="images/07_contact_bg.png" alt=""></div>
          <div class="contact01"><img src="images/07_contact01.png" alt=""></div>
          <div class="text01"><img src="images/07_contact_text01.png" alt=""></div>
          <!--  -->
          <div class="contact02"><img src="images/07_contact02.png" alt=""></div>
          <div class="contact03"><img src="images/07_contact03.png" alt=""></div>
          <!--  -->
        </div>
        <div class="login">
          <div class="loginbg"><img src="images/07_login_bg.png" alt=""></div>
          <!--  -->
          <div class="loginscreen"><img src="images/07_loginscreen.png" alt=""></div>
          <div class="textline"><img src="images/07_login_line.png" alt=""></div>
          <div class="logintext"><img src="images/07_login_text.png" alt=""></div>
          <!--  -->
          <div class="spin01"><img src="images/07_login_spin01.png" alt=""></div>
          <div class="spin02"><img src="images/07_login_spin02.png" alt=""></div>
        </div>
        <div class="thanks">
          <div class="bg"><img src="images/08_bg.png" alt=""></div>
          <div class="thankstext"><img src="images/08_thanks.png" alt=""></div>
          <div class="img"><img src="images/08_img.png" alt=""></div>
          <div class="smalltext"><img src="images/08_smalltext.png" alt=""></div>
        </div>
      </section>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/plugin/gsap.js"></script>
    <script src="js/plugin/scrollTrigger.js"></script>
    <script src="js/scrollbar.js"></script>
    <script src="js/setting.js"></script>
    <script src="js/main.js"></script>
    <script>
      console.log(document.querySelector(".cls-0").getTotalLength());
    </script>
  </body>
</html>
